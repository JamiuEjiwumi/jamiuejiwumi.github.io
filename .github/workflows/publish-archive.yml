name: Publish portfolio
on:
  push:
    branches: [main]
    paths-ignore:
      - '*.zip'
      - 'README.md'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate static site
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html work.html experience.html method.html profile.html styles.css script.js assets/favicon.svg; do
            test -s "$f" || { echo "::error file=$f::Missing or empty file"; exit 1; }
          done
          if grep -RIl 'jamiuejiwumi.github.io/jamiu-portfolio/' --include='*.html' .; then
            echo "::error::Legacy portfolio URL remains in site metadata"
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
