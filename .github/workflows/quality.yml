name: Portfolio quality audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'styles.css'
      - 'script.js'
      - 'examples/**'
      - 'scripts/check_site.py'
      - 'scripts/generate_cv.py'
      - '.github/workflows/quality.yml'
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build downloadable CV for link validation
        run: |
          python -m pip install --disable-pip-version-check 'reportlab==4.2.5'
          python scripts/generate_cv.py
          test -s assets/Jamiu_Ejiwumi_Senior_DevOps_CV.pdf
      - name: Validate local links and accessible structure
        run: python scripts/check_site.py
      - name: Lighthouse performance and accessibility audit
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false
